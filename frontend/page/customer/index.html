<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>월계생활</title>
  <meta name="description" content="우리 동네가, 더 가까워지는 일상 - 월계생활" />
  <link rel="stylesheet" href="../../css/theme.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/customer.css" />
</head>
<body>
  <div class="app-shell customer-shell">
    <div class="screen-stack" id="screen-stack">

      <!-- ============ 화면 1 : 첫 화면 ============ -->
      <section class="screen" id="screen-home" aria-label="첫 화면">
        <div class="pull-indicator pull-indicator--top" id="handle-to-nearby" role="button" tabindex="0" aria-label="내 주변 가게 보기">
          <div class="pull-handle"></div>
          <div class="pull-hint">지도 · 가게 보기 <svg class="icon" viewBox="0 0 24 24" style="width:0.9em;height:0.9em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="pull-hint" style="font-weight:400;color:var(--color-text-faint);">아래로 당기거나 눌러보세요</div>
        </div>

        <header class="app-header">
          <div class="brand">
            월계생활
            <span class="location"><span class="loc-label">월계1동</span></span>
          </div>
          <button class="icon-btn" type="button" data-toast="설정 화면은 준비 중이에요" aria-label="설정">⚙</button>
        </header>

        <div class="home-body">
          <p class="home-tagline">우리 동네, 더 가까이</p>

          <div class="category-grid" id="category-grid"></div>

          <button class="btn-primary cta-bottom" type="button" id="cta-nearby">
            <span>가까운 가게의 혜택을 만나보세요</span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </section>

      <!-- ============ 화면 2 : 내 주변 가게 (상단을 내리면) ============ -->
      <section class="screen" id="screen-nearby" aria-label="내 주변 가게">
        <header class="app-header">
          <div class="brand">
            월계생활
            <span class="location"><span class="loc-label">월계1동</span></span>
          </div>
          <button class="icon-btn" type="button" data-toast="설정 화면은 준비 중이에요" aria-label="설정">⚙</button>
        </header>

        <div class="nearby-body">
          <h2 class="section-title">내 주변 가게</h2>
          <p class="section-subtitle">배우고, 만들고, 경험하는 월계1동의 특별한 하루</p>

          <div class="filter-tabs" id="filter-tabs"></div>

          <div class="map-placeholder" aria-hidden="true">
            <svg viewBox="0 0 400 190" preserveAspectRatio="none">
              <rect width="400" height="190" fill="var(--color-surface-alt)" />
              <path d="M270 -10 C 230 40, 300 90, 260 140 C 230 175, 260 200, 300 220" stroke="#bcd9ef" stroke-width="26" fill="none" opacity="0.7"/>
              <g stroke="var(--color-border)" stroke-width="2">
                <path d="M0 60 H400" />
                <path d="M0 120 H400" />
                <path d="M90 0 V190" />
                <path d="M190 0 V190" />
              </g>
              <circle cx="55" cy="150" r="26" fill="#e3ecdc" />
              <circle cx="345" cy="45" r="20" fill="#e3ecdc" />
            </svg>
            <div id="map-pins"></div>
          </div>

          <div class="list-panel">
            <div class="list-header">
              <span class="count" id="store-count">주변 가게 0곳</span>
              <div class="sort-toggle">
                <button class="sort-btn is-active" type="button" data-sort="distance">거리순</button>
                <button class="sort-btn" type="button" data-sort="name">이름순</button>
              </div>
            </div>
            <ul class="store-list" id="store-list"></ul>
          </div>
        </div>

        <div class="pull-indicator pull-indicator--bottom" id="handle-to-home" role="button" tabindex="0" aria-label="첫 화면으로 돌아가기">
          <div class="pull-hint">첫 화면으로</div>
          <div class="pull-hint" style="font-weight:400;color:var(--color-text-faint);">위로 밀어 올리거나 눌러주세요</div>
        </div>
      </section>

    </div>

    <p class="owner-link-row">사장님이신가요? <a href="../owner/index.html">사장님 앱 바로가기</a></p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../../js/data.js"></script>
  <script src="../../js/customer.js"></script>
  <script>
    document.getElementById("cta-nearby").addEventListener("click", function () {
      document.getElementById("screen-stack").classList.add("is-nearby");
    });
  </script>
</body>
</html>
