<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>월계생활</title>
  <meta name="description" content="우리 동네가, 더 가까워지는 일상 - 월계생활" />
  <link rel="stylesheet" href="../../css/theme.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/customer.css" />
</head>
<body>
  <div class="app-shell customer-shell">
    <div class="screen-stack" id="screen-stack">

      <!-- ============ 화면 1 : 첫 화면 ============ -->
      <section class="screen" id="screen-home" aria-label="첫 화면">
        <div class="pull-indicator pull-indicator--top" id="handle-to-nearby" role="button" tabindex="0" aria-label="내 주변 가게 보기">
          <div class="pull-handle"></div>
          <div class="pull-hint">지도 · 가게 보기 <svg class="icon" viewBox="0 0 24 24" style="width:0.9em;height:0.9em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="pull-hint" style="font-weight:400;color:var(--color-text-faint);">아래로 당기거나 눌러보세요</div>
        </div>

        <header class="app-header">
          <div class="brand">
            월계생활
            <span class="location"><span class="loc-label">월계1동</span></span>
          </div>
          <div class="header-actions">
            <div class="auth-slot" data-auth-slot></div>
            <button class="icon-btn" type="button" data-toast="설정 화면은 준비 중이에요" aria-label="설정">⚙</button>
          </div>
        </header>

        <div class="home-body">
          <h1 class="home-heading">오늘은 동네에서<br />뭐 할까요?</h1>

          <div class="home-illustration" aria-hidden="true">
            <svg viewBox="0 0 340 118" xmlns="http://www.w3.org/2000/svg">
              <circle cx="30" cy="20" r="14" fill="var(--color-cat-sale-bg)" />
              <g>
                <rect x="12" y="66" width="52" height="46" rx="3" fill="var(--color-cat-class-bg)" />
                <path d="M10 66 38 46 66 66Z" fill="var(--color-cat-class-bg)" />
                <rect x="70" y="44" width="42" height="68" rx="3" fill="var(--color-cat-space-bg)" />
                <rect x="79" y="54" width="8" height="8" fill="var(--color-surface)" />
                <rect x="95" y="54" width="8" height="8" fill="var(--color-surface)" />
                <rect x="79" y="70" width="8" height="8" fill="var(--color-surface)" />
                <rect x="95" y="70" width="8" height="8" fill="var(--color-surface)" />
                <rect x="120" y="72" width="56" height="40" rx="3" fill="var(--color-cat-partner-bg)" />
                <path d="M117 72 148 52 179 72Z" fill="var(--color-cat-partner-bg)" />
                <rect x="188" y="52" width="36" height="60" rx="3" fill="var(--color-cat-coupon-bg)" />
                <rect x="196" y="62" width="7" height="7" fill="var(--color-surface)" />
                <rect x="209" y="62" width="7" height="7" fill="var(--color-surface)" />
                <rect x="196" y="78" width="7" height="7" fill="var(--color-surface)" />
                <rect x="209" y="78" width="7" height="7" fill="var(--color-surface)" />
                <circle cx="252" cy="100" r="10" fill="var(--color-cat-space-bg)" />
                <rect x="250" y="100" width="4" height="12" fill="var(--color-cat-partner-bg)" />
              </g>
              <g>
                <path d="M204 6h122a10 10 0 0 1 10 10v18a10 10 0 0 1-10 10h-60l-12 12v-12h-50a10 10 0 0 1-10-10V16a10 10 0 0 1 10-10Z" fill="var(--color-surface)" stroke="var(--color-border)" />
                <text x="265" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="var(--color-text)">오늘도</text>
                <text x="265" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="var(--color-text)">좋은 하루 되세요!</text>
              </g>
            </svg>
          </div>

          <div class="category-grid" id="category-grid"></div>

          <button class="btn-primary cta-bottom" type="button" id="cta-nearby">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 10v4a1 1 0 0 0 1 1h2l2.5 5.5V3.5L6 9H4a1 1 0 0 0-1 1Z"/><path d="M9.5 5.5 19 3v18l-9.5-2.5"/><path d="M19 9.5a3 3 0 0 1 0 5"/></svg>
            <span>가까운 가게의 혜택을 만나보세요</span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </section>

      <!-- ============ 화면 2 : 내 주변 가게 (상단을 내리면) ============ -->
      <section class="screen" id="screen-nearby" aria-label="내 주변 가게">
        <header class="app-header">
          <div class="brand">
            월계생활
            <span class="location"><span class="loc-label">월계1동</span></span>
          </div>
          <div class="header-actions">
            <div class="auth-slot" data-auth-slot></div>
            <button class="icon-btn" type="button" data-toast="설정 화면은 준비 중이에요" aria-label="설정">⚙</button>
          </div>
        </header>

        <div class="nearby-body">
          <h2 class="section-title">지금 만나는 동네 가게</h2>
          <p class="section-subtitle">배우고, 만들고, 경험하는 월계1동의 특별한 하루</p>

          <div class="filter-tabs" id="filter-tabs"></div>

          <div class="map-placeholder" aria-hidden="true">
            <svg viewBox="0 0 400 190" preserveAspectRatio="none">
              <rect width="400" height="190" fill="var(--color-surface-alt)" />
              <path d="M270 -10 C 230 40, 300 90, 260 140 C 230 175, 260 200, 300 220" stroke="#bcd9ef" stroke-width="26" fill="none" opacity="0.7"/>
              <g stroke="var(--color-border)" stroke-width="2">
                <path d="M0 60 H400" />
                <path d="M0 120 H400" />
                <path d="M90 0 V190" />
                <path d="M190 0 V190" />
              </g>
              <circle cx="55" cy="150" r="26" fill="#e3ecdc" />
              <circle cx="345" cy="45" r="20" fill="#e3ecdc" />
            </svg>
            <span class="map-label" style="left:8%;bottom:8%;">월계근린공원</span>
            <span class="map-label" style="right:6%;top:8%;">월계천</span>
            <button class="map-locate-btn" type="button" data-toast="현재 위치는 예시입니다" aria-label="현재 위치">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2 13 13l-3.8 1.8L11 11l3.8-1.8Z"/></svg>
            </button>
            <div id="map-pins"></div>
          </div>
          <p class="map-caption">가게 · 거리 · 지도는 예시입니다</p>

          <div class="list-panel">
            <div class="list-drag-handle"><span></span></div>
            <div class="list-header">
              <span class="count" id="store-count">주변 가게 0곳</span>
              <div class="sort-toggle">
                <button class="sort-btn is-active" type="button" data-sort="distance">거리순</button>
                <button class="sort-btn" type="button" data-sort="name">이름순</button>
              </div>
            </div>
            <ul class="store-list" id="store-list"></ul>
          </div>
        </div>

        <div class="pull-indicator pull-indicator--bottom" id="handle-to-home" role="button" tabindex="0" aria-label="첫 화면으로 돌아가기">
          <div class="pull-hint"><svg class="icon" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg> 첫 화면으로</div>
          <div class="pull-hint" style="font-weight:400;color:var(--color-text-faint);">위로 밀어 올리거나 눌러주세요</div>
        </div>
      </section>

    </div>

    <p class="owner-link-row">사장님이신가요? <a href="../owner/index.html">사장님 앱 바로가기</a></p>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="auth-modal-overlay" hidden>
    <div class="modal card auth-modal">
      <button class="modal-close" type="button" aria-label="닫기">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h3 class="auth-modal-title">로그인</h3>
      <p class="auth-modal-sub">월계1동 이웃들과 더 가까워져요</p>

      <div class="auth-provider-list">
        <button class="auth-provider-btn provider-naver" type="button" data-provider="네이버">네이버로 시작하기</button>
        <button class="auth-provider-btn provider-kakao" type="button" data-provider="카카오">카카오로 시작하기</button>
        <button class="auth-provider-btn provider-google" type="button" data-provider="구글">구글로 시작하기</button>
      </div>

      <div class="auth-divider"><span>또는</span></div>

      <form class="auth-name-form">
        <input class="auth-name-input" type="text" placeholder="닉네임을 입력해주세요" maxlength="12" autocomplete="off" />
        <button class="btn-primary" type="submit">이 이름으로 시작하기</button>
      </form>
    </div>
  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/customer.js"></script>
  <script>
    document.getElementById("cta-nearby").addEventListener("click", function () {
      document.getElementById("screen-stack").classList.add("is-nearby");
    });
  </script>
</body>
</html>
